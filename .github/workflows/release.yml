name: Release

# Builds the Windows installer and portable exe on real Windows (no wine needed)
# and attaches them to a GitHub Release. Trigger: push a tag like v1.0.0.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the test suite
        run: npm test

      - name: Build NSIS installer + portable exe
        # Optional: set the repo secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
        # with a code-signing cert and map them to CSC_LINK / CSC_KEY_PASSWORD
        # below to remove the SmartScreen "unknown publisher" warning.
        # --publish never: releases are attached below via softprops/action-gh-release,
        # so electron-builder must not try to publish on its own (it has no token).
        run: npx electron-builder --win nsis portable --x64 --publish never

      # The app verifies this file before running a downloaded installer, so
      # it has to travel with the release — no checksum, no install.
      - name: Write SHA256SUMS.txt
        run: |
          Set-Location dist
          $lines = @(Get-ChildItem *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          })
          if (-not $lines) { throw 'No exe files in dist to checksum.' }
          [System.IO.File]::WriteAllLines("$PWD/SHA256SUMS.txt", $lines)
          Get-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/latest.yml
            dist/SHA256SUMS.txt

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/SHA256SUMS.txt
          generate_release_notes: true